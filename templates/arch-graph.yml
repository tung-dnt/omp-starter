# GitHub Actions workflow for a repository that keeps docs/arch/ (see scripts/arch-graph.ts in omp-starter).
# Copy it to .github/workflows/arch-graph.yml; the check fails a PR whose docs/arch/ is not what the code produces.
name: arch-graph
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OMP_STARTER_REF: main
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        if: hashFiles('**/go.mod') != ''
      - run: curl -fsSL "https://raw.githubusercontent.com/tung-dnt/omp-starter/${OMP_STARTER_REF}/scripts/arch-graph.ts" -o "$RUNNER_TEMP/arch-graph.ts" && bun "$RUNNER_TEMP/arch-graph.ts" check .
