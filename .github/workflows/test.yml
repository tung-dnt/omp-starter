# Fast feedback on every push: unit tests, type check and bundle build, on Bun only.
# The SDK-heavy LSP/DAP proof runs separately in tooling.yml.
#
# This workflow only reads the repository: no secrets, no deploy, no publication.
name: Test

on:
  push:
    branches-ignore:
      - "claim/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"

jobs:
  test:
    name: bun test, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun build extensions/setup.ts extensions/kb-commit-gate.ts extensions/kb-memory.ts extensions/kb-memory-tools.ts extensions/kb-command.ts extensions/fable-router.ts extensions/lsp-guard.ts --target=bun --packages=external --outdir="$RUNNER_TEMP/omp-starter-build"
