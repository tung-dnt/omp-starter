# Step 5 requirements: the locked definition of done for the scheduler, slots and verdict schemas.
# Checker: `bun run verify:step5` (exit 0 = done). Commit under draft: omp-starter 62a2973 (feat/spec-workflow).
# Sources: LLD = vault Specs/omp-starter/stories/spec-workflow/lld/step5-scheduler.md (incl. Amendments 1-3 and the threat model);
#          BRIEF = .ovis/OMP_Spec-Driven_Workflow_End-to-End_Setup-20261103-190349-b5f09408.md. Cited by heading.
# scope: in = must be proven by its evidence; residual = accepted or deferred, no evidence; out = not step 5 (reason given).
# evidence: empty list = MISSING (fails the checker until a test or scenario exists).
# bun-test evidence: `name` is a substring of a describe()/test()/it() title in `file`. scenario evidence: id in `scenarios:` below (to be built under test/tier3).
# Merged: R-52 (independent task completes when another is blocked) is merged into R-03.
version: 1
story: spec-workflow
