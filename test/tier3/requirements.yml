scenarios:
  - id: S-haiku-two-task
    runner: haiku
    repeats: 3
    description: "Baseline: a real two-task story at concurrency 2 over omp --mode rpc from a fixture without the pre-push hook; the hook gate is answered install; asserts T3-1..T3-11 (outcome, spec-status, trailers, Task-Lock, check notes, hook, run log, no TypeSafe or Jev tool calls, real state untouched, cost, no leftover roots) plus run-story registered once, setStatus frames, the final notify, and no push (remote refs and vault git unchanged)."
    proves: [R-01, R-17, R-20, R-21, R-56, R-57, R-79, R-80, R-81, R-85, R-92, R-93, R-97, R-101, R-102, R-106, R-107, R-109]
  - id: S-haiku-failing-check
    runner: haiku
    repeats: 3
    description: "Real slots with a test command that always fails: the output goes back to the implementer, 3 attempts reach the cap, a blocked note and the cap gate; the gate is answered retry once (exactly one more attempt), then stop; the failure notifies; every gate answer is logged."
    proves: [R-04, R-94, R-96, R-97, R-102, R-109]
  - id: S-haiku-tiny-budget
    runner: haiku
    repeats: 3
    description: "A tiny --budget with real slots: in-flight slots finish, the budget gate opens, a raise by $50 continues, stop ends the run without blocked notes."
    proves: [R-67, R-68, R-96, R-97]
  - id: S-haiku-tiny-context
    runner: haiku
    repeats: 3
    description: "A tiny context ceiling makes every real slot abort with aborted: context; each counts as an attempt and the next prompt says so; the cap gate opens."
    proves: [R-70]
  - id: S-haiku-tiny-timeout
    runner: haiku
    repeats: 3
    description: "A 1-second slot wall timeout with real slots: the SDK session is aborted through the signal, the abort counts as an attempt, the cap gate opens."
    proves: [R-72]
  - id: S-haiku-plan-commit-midrun
    runner: haiku
    repeats: 3
    description: "The driver commits a new plan revision to the vault while a real slot is in flight: no new starts, the plan-changed gate arrives over RPC, stop ends the run with the reason and the task stays ready."
    proves: [R-64, R-97]
  - id: S-haiku-plan-edit-midrun
    runner: haiku
    repeats: 3
    description: "The driver edits the vault plan without committing while a real slot is in flight: counts as a change; answering continue keeps the run's own Plan-Rev in later prompts."
    proves: [R-65]
  - id: S-haiku-run-stop
    runner: haiku
    repeats: 3
    description: "The driver sends /run-stop over RPC while a real slot is in flight: the slot aborts, no blocked note is written, worktrees are removed, tasks stay ready."
    proves: [R-91]
  - id: S-haiku-sigkill-resume
    runner: haiku
    repeats: 3
    description: "SIGKILL the omp process mid-slot of a two-task story, leaving real partial git state; the next run finishes the story from derived state, at concurrency 1 and 2."
    proves: [R-61]
  - id: S-haiku-run-task
    runner: haiku
    repeats: 3
    description: "/run-task with a one-block task plan runs to completion over RPC."
    proves: [R-87]
  - id: S-haiku-two-repo
    runner: haiku
    repeats: 3
    description: "A two-repo fixture: a run completes and each repo's ticket branch receives its commits, with a per-repo hook and lock."
    proves: [R-113]
  - id: S-deps-and-concurrency
    runner: scripted
    repeats: 1
    description: "Scripted slots over RPC in a four-task plan with a dependency: the dependant starts only after its dependency is done, and the run log never shows more than 2 tasks running at once."
    proves: [R-01, R-02]
  - id: S-blocked-stops-dependants
    runner: scripted
    repeats: 1
    description: "A task is blocked at the cap; its dependant never starts; an independent task completes."
    proves: [R-03]
  - id: S-payload-forms
    runner: scripted
    repeats: 1
    description: "Scripted yields through the real session with strict outputSchema: a schema-invalid payload, a non-JSON payload, a string-encoded JSON payload, a yield error and another slot's verdict value; each outcome and the reason in the next prompt are asserted."
    proves: [R-05, R-06, R-08]
  - id: S-verdict-test-author
    runner: scripted
    repeats: 1
    description: "test_author spec_wrong, need_clarification and blocked: blocked note and gate over RPC; retry collects a note through ctx.ui.input and the next prompt carries it; each answer is logged."
    proves: [R-09, R-10, R-94, R-96, R-97, R-98]
  - id: S-verdict-test-review
    runner: scripted
    repeats: 1
    description: "test_review pass locks; fix reruns the author once; a second fix opens the cap gate; spec_wrong opens a gate."
    proves: [R-09, R-11]
  - id: S-verdict-implementer-stop
    runner: scripted
    repeats: 1
    description: "implementer need_shared_change (gate offers only stop, nothing committed), need_clarification and blocked (gate stop or retry)."
    proves: [R-09, R-12, R-13]
  - id: S-test-wrong-approved
    runner: scripted
    repeats: 1
    description: "implementer test_wrong with the gate approved over RPC: Task-Unlock commit with Unlock-Gate, rewritten tests, relock, then the implementation."
    proves: [R-09, R-14, R-96]
  - id: S-test-wrong-rejected
    runner: scripted
    repeats: 1
    description: "implementer test_wrong with the gate rejected: the implementer reruns told the tests stand; a second case answers stop and the task is blocked."
    proves: [R-09, R-15]
  - id: S-verdict-code-security-review
    runner: scripted
    repeats: 1
    description: "code_review and security_review fix and spec_wrong: fix reruns the implementer with the findings and counts toward the cap; spec_wrong opens a gate; nothing is integrated before resolution."
    proves: [R-09, R-16]
  - id: S-story-review-findings
    runner: scripted
    repeats: 1
    description: "Story code_review findings open a gate over RPC: accept finishes the story; stop leaves it incomplete."
    proves: [R-09, R-17]
  - id: S-review-routing
    runner: scripted
    repeats: 1
    description: "A validated plan with technical and security-flagged risks: the run log shows code_review for any risk, security_review when flagged, and none otherwise."
    proves: [R-18]
  - id: S-guard-in-session
    runner: scripted
    repeats: 1
    description: "Scripted slots inside a real session try git commit and HEAD moves in bash, writes outside the scope, an edit of a locked test, and a non-test write in the tests phase with a plan-declared checks.test_paths; the in-session guard and the post-slot snapshot reject each, and the retry prompt carries the message."
    proves: [R-23, R-24, R-25, R-26]
  - id: S-forged-worktree-config
    runner: scripted
    repeats: 1
    description: "A scripted slot writes .omp and .claude agent definitions above and inside the worktree; the slot is rejected, the folders are removed, and the next session uses the agent definitions read at run start."
    proves: [R-38, R-39]
  - id: S-session-options
    runner: scripted
    repeats: 1
    description: "Reads back the effective options and tool list of a real slot session (restricted tools, required yield, strict schema, thinking level, no MCP or UI, guard preloaded, title, fresh session per slot) for a writing and a read-only slot."
    proves: [R-77, R-78]
  - id: S-conflict-gate
    runner: scripted
    repeats: 1
    description: "Two tasks edit the same lines: the conflict gate arrives over RPC naming refs/spec-conflict/<ticket>/<task> and the cherry-pick command; the ticket branch is untouched, the task blocked with reason conflict, its dependants stop."
    proves: [R-44, R-96]
  - id: S-integrated-guard-violation
    runner: scripted
    repeats: 1
    description: "A task whose integrated range violates spec-guard (real guard): blocked before the ticket branch moves."
    proves: [R-46, R-105]
  - id: S-publish-error
    runner: scripted
    repeats: 1
    description: "A real non-fast-forward publish error: the blocked gate arrives over RPC; retry replays the whole integration."
    proves: [R-47]
  - id: S-index-lock-error
    runner: scripted
    repeats: 1
    description: "A real index.lock held in the clone during a git operation: the gate carries the error; retry replays that operation only."
    proves: [R-48]
  - id: S-gate-queue
    runner: scripted
    repeats: 1
    description: "Two tasks stop at the same time: the two gates reach the RPC client one at a time, each answered in order."
    proves: [R-51, R-97]
  - id: S-setup-gates
    runner: scripted
    repeats: 1
    description: "A fixture with no ticket branch and no pre-push hook: the missing-branch and missing-hook gates arrive over RPC; create and install are answered and applied (hook installed by the omp binary path, not bun), a second run answers stop and creates nothing; every answer is logged."
    proves: [R-55, R-56, R-57, R-94, R-96, R-97]
  - id: S-refusals
    runner: scripted
    repeats: 1
    description: "Each precondition refuses the run with no slot started: uncommitted vault plan, plan that does not parse, wrong kind, no checks.test_files, dirty clone."
    proves: [R-53]
  - id: S-run-lock
    runner: scripted
    repeats: 1
    description: "A second omp run while the first is parked at a gate is refused naming the lock file, pid and start time, and the first run's worktree survives; a dead-pid lock is taken over and logged; a live pid or another host refuses; the lock is released after refused and completed runs."
    proves: [R-59, R-60]
  - id: S-parallel-sessions
    runner: scripted
    repeats: 1
    description: "Two tasks run at concurrency 2 in real parallel SDK sessions finishing together: each session has its own agent id (never Main), both are released on dispose, integrations are serialized and the later task is replayed on the new tip; both end done."
    proves: [R-49, R-80]
  - id: S-already-passes
    runner: scripted
    repeats: 1
    description: "A scripted test_author writes a test that already passes on the base: the real test runner reports already-passes and test_author reruns with the evidence."
    proves: [R-100]
  - id: S-tui-input-intercept
    runner: scripted
    repeats: 1
    description: "A pty-driven omp TUI session (no model): typed interactive input during a run is intercepted with a notice; run controls pass; a second run is refused."
    proves: [R-90]
  - id: S-foundation-first
    runner: scripted
    repeats: 1
    description: "A plan with a foundation task and dependants: the foundation task runs first and must pass its checks before any other task starts; a failing foundation keeps the others unstarted."
    proves: [R-104]
  - id: S-patient-data-block
    runner: scripted
    repeats: 1
    description: "A security_review finding on patient data blocks the merge until the human decides at the gate; no integration happens before the answer."
    proves: [R-108]
